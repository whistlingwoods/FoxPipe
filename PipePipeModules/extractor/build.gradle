plugins {
    id 'java-library'
    id 'checkstyle'
    id 'com.squareup.wire' version '5.5.0'
}

version = 'v4.8.1'
group = 'com.github.TeamNewPipe'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        java.srcDir(rootDir.toPath().resolve("PipePipeExtractor/extractor/src/main/java").toFile())
    }
    test {
        java.srcDir(rootDir.toPath().resolve("PipePipeExtractor/extractor/src/test/java").toFile())
        resources.srcDir(
                rootDir.toPath().resolve("PipePipeExtractor/extractor/src/test/resources").toFile())
    }
}

test {
    if (System.properties.containsKey('downloader')) {
        systemProperty('downloader', System.getProperty('downloader'))
    }
    useJUnitPlatform()
    dependsOn checkstyleMain
}

checkstyle {
    getConfigDirectory().set(rootProject.file("checkstyle"))
    ignoreFailures false
    showViolations true
    toolVersion '9.3'
}

wire {
    java {
    }
}

checkstyleTest {
    enabled false
}

dependencies {
    implementation project(':timeago-parser')

    implementation 'com.github.TeamNewPipe:nanojson:e9d656ddb49a412a5a0a5d5ef20ca7ef09549996'
    implementation 'org.jsoup:jsoup:1.15.3'
    implementation 'org.java-websocket:Java-WebSocket:1.4.1'
    implementation 'com.github.spotbugs:spotbugs-annotations:4.6.0'
    implementation 'org.nibor.autolink:autolink:0.10.0'
    implementation 'com.google.protobuf:protobuf-java:3.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.squareup.wire:wire-runtime:5.5.0'
    implementation 'org.brotli:dec:0.1.1'
    implementation 'org.apache.commons:commons-lang3:3.8.1'
    implementation 'commons-codec:commons-codec:1.16.0'
    implementation 'org.json:json:20231013'
    implementation 'org.cache2k:cache2k-api:2.6.1.Final'
    implementation 'org.cache2k:cache2k-core:2.6.1.Final'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
    implementation 'org.mozilla:rhino:1.7.13'

    checkstyle 'com.puppycrawl.tools:checkstyle:9.3'

    testImplementation platform('org.junit:junit-bom:5.8.2')
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'com.google.code.gson:gson:2.9.1'
}
